name: Full CI/CD Pipeline

on:
  pull_request:
    branches:
      - feat-test-Auth-CRUD

  push:
    branches:
      - feat-test-Auth-CRUD

env:
  IMAGE_NAME: auth-crud-app
  APP_DIR: ./Code-challenges/Task-test-auth-CRUD

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.M_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.M_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.M_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test-auth-crud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./Code-challenges/Task-test-auth-CRUD
    env:
      DB_HOST: ${{ secrets.M_DB_HOST }}
      DB_PORT: ${{ secrets.M_DB_PORT }}
      DB_USER: ${{ secrets.M_DB_USER }}
      DB_PASSWORD: ${{ secrets.M_DB_PASSWORD }}
      DB_NAME: ${{ secrets.M_DB_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./Code-challenges/Task-test-auth-CRUD/package-lock.json

      - run: npm ci
      # - run: npm run lint
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Code-challenges/Task-test-auth-CRUD

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Image Tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      # - name: Login to Docker Hub
      #   run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Image
        run: docker build -f dockerfile -t $IMAGE_NAME:${{ steps.meta.outputs.tag }} .

      # - name: Push Image
      #   run: docker push $IMAGE_NAME:${{ steps.meta.outputs.tag }}
