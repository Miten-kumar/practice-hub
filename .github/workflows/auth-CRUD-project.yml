name: Full CI/CD Pipeline

on:
  pull_request:
    branches: feat-test-Auth-CRUD
    paths: "Code-challenges/Task-test-auth-CRUD/**"

  push:
    branches: feat-test-Auth-CRUD
    paths: "Code-challenges/Task-test-auth-CRUD/**"

env:
  IMAGE_NAME: auth-crud-app

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./Code-challenges/Task-test-auth-CRUD/package-lock.json

      - run:
        working-directory: ./Code-challenges/Task-test-auth-CRUD

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - run:
        working-directory: ./Code-challenges/Task-test-auth-CRUD

      - name: Set Image Tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      # - name: Login to Docker Hub
      #   run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Image
        run: docker build -t $IMAGE_NAME:${{ steps.meta.outputs.tag }} .

      # - name: Push Image
      #   run: docker push $IMAGE_NAME:${{ steps.meta.outputs.tag }}
